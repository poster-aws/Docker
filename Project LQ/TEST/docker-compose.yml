services:

  php:
    build: .
    image: my-php  # Задаем имя образа
    container_name: php-fpm
    volumes:
      - ./src:/var/www/html
    networks:
      - test_net
    ports:
      - "9000:9000"  # Порт для взаимодействия с Nginx

  nginx:
    image: nginx:latest
    container_name: nginx-server
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    ports:
      - "80:80"
    networks:
      - test_net
    depends_on:
      - php

networks:
  test_net:
    name: test_net # Явно указываем имя сети, чтобы Adminer мог её использовать
