<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Примеры рукописных шрифтов</title>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat&family=Dancing+Script&family=Great+Vibes&family=Pacifico&family=Satisfy&family=Shadows+Into+Light&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f4f4f4;
      padding: 20px;
      font-size: 32px;
      line-height: 2;
    }
    .font-sample {
      margin-bottom: 20px;
    }
    .alex { font-family: 'Alex Brush', cursive; }
    .caveat { font-family: 'Caveat', cursive; }
    .dancing { font-family: 'Dancing Script', cursive; }
    .great { font-family: 'Great Vibes', cursive; }
    .pacifico { font-family: 'Pacifico', cursive; }
    .satisfy { font-family: 'Satisfy', cursive; }
    .shadows { font-family: 'Shadows Into Light', cursive; }
    .label {
      font-size: 16px;
      color: #555;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="font-sample alex">
    Quotidienne2
    <div class="label">Alex Brush</div>
  </div>

  <div class="font-sample caveat">
    Quotidienne2
    <div class="label">Caveat</div>
  </div>

  <div class="font-sample dancing">
    Quotidienne2
    <div class="label">Dancing Script</div>
  </div>

  <div class="font-sample great">
    Quotidienne2
    <div class="label">Great Vibes</div>
  </div>

  <div class="font-sample pacifico">
    Quotidienne2
    <div class="label">Pacifico</div>
  </div>

  <div class="font-sample satisfy">
    Quotidienne2
    <div class="label">Satisfy</div>
  </div>

  <div class="font-sample shadows">
    Quotidienne2
    <div class="label">Shadows Into Light</div>
  </div>

</body>
</html>
