services:

  backup:
    image: mysql:8
    container_name: mysql_backup
    volumes:
      - ./backup.sh:/backup.sh
      - ../BackupDB:/backups
    entrypoint: ["/bin/sh", "-c", "/backup.sh"]
    restart: "no"
    networks:
      - mysql_net

networks:
  mysql_net:
    external: true  # Используем уже созданную сеть