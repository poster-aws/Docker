services:

  backup:
    image: mysql:8
    container_name: mysql_restore
    volumes:
      - ./restore.sh:/restore.sh
      - ../BackupDB:/backups
    entrypoint: ["/bin/sh", "-c", "/restore.sh"]
    restart: "no"
    networks:
      - mysql_net

networks:
  mysql_net:
    external: true  # Используем уже созданную сеть