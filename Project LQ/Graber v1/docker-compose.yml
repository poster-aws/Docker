services:

  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=user
      - DB_NAME=quotidienne2
    networks:
      - mysql_net
    command: ["./wait-for-it.sh", "db:3306", "--", "python", "main.py"]

networks:
  mysql_net:
    external: true  # Используем уже созданную сеть