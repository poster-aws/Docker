services:

  db:
    image: mysql
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quotidienne2  # Создаем БД
      MYSQL_USER: user
      MYSQL_PASSWORD: q
    volumes:
     - ./sql:/docker-entrypoint-initdb.d  # Загрузка SQL скриптов при старте
     - ./DB:/var/lib/mysql/  # Для персистентности данных
    ports:
      - "3306:3306"  # Открываем порт 3306
    networks:
      - mysql_net

networks:
  mysql_net:
    name: mysql_net # Явно указываем имя сети, чтобы Adminer мог её использовать
