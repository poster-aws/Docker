# TEST3 — только веб (nginx + php). БД общая с TEST2 (сеть mysql_net).
# Запускайте сначала: cd TEST2 && docker compose up -d
# Затем: cd TEST3 && docker compose up -d

services:
  php:
    build: .
    image: my-php-test3
    container_name: php-fpm-test3
    volumes:
      - ./src:/var/www/html
    networks:
      - mysql_net
    ports:
      - "9001:9000"

  nginx:
    image: nginx:latest
    container_name: nginx-test3
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    ports:
      - "8081:80"
    networks:
      - mysql_net
    depends_on:
      - php

  adminer:
    image: adminer
    container_name: adminer-test3
    ports:
      - "8082:8080"
    networks:
      - mysql_net

networks:
  mysql_net:
    external: true
