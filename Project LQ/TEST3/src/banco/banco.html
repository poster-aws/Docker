<div id="banco-meta" data-count="<?= (int) $bancoCount ?>" data-header-sub-fr="<?= htmlspecialchars(t_for_lang('banco.header.sub', 'fr'), ENT_QUOTES, 'UTF-8') ?>" data-header-sub-en="<?= htmlspecialchars(t_for_lang('banco.header.sub', 'en'), ENT_QUOTES, 'UTF-8') ?>"></div>

<div class="banco-layout">
  <div class="table-wrapper banco-grid-wrapper" data-limit="<?= (int) $limit ?>">
    <?php if (!empty($tirages)): ?>
    <table class="digit-grid" id="bancoGrid">
      <thead>
        <tr>
          <th><?= htmlspecialchars(t('banco.col.tot'), ENT_QUOTES, 'UTF-8') ?></th>
          <th>#</th>
          <?php foreach ($tirages as $t): ?>
            <th><?= htmlspecialchars($t['Tirage'], ENT_QUOTES, 'UTF-8') ?></th>
          <?php endforeach; ?>
        </tr>
        <tr class="banco-turbo-row">
          <th></th>
          <th><?= htmlspecialchars(t('banco.col.turbo'), ENT_QUOTES, 'UTF-8') ?></th>
          <?php foreach ($tirages as $t): ?>
            <th><?= (int) $t['turbo'] ?>x</th>
          <?php endforeach; ?>
        </tr>
      </thead>
      <tbody>
        <?php for ($digit = 1; $digit <= 70; $digit++): ?>
          <tr>
            <td>&nbsp;<?= (int) $totals[$digit] ?>x&nbsp;</td>
            <td><?= $digit ?></td>
            <?php foreach ($tirages as $t): ?>
              <?php $isHit = isset($t['flip'][$digit]); ?>
              <td class="<?= $isHit ? 'hit' : '' ?>"><?= $isHit ? $digit : '' ?></td>
            <?php endforeach; ?>
          </tr>
        <?php endfor; ?>
      </tbody>
    </table>
    <?php else: ?>
    <p class="no-data"><?= htmlspecialchars(t('banco.no_data'), ENT_QUOTES, 'UTF-8') ?></p>
    <?php endif; ?>
  </div>
</div>
