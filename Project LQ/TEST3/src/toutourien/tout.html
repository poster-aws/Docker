<div id="tout-meta" data-count="<?= (int)$toutCount ?>"></div>
<div class="tout-layout">
  <div class="table-wrapper tout-grid-wrapper" data-limit="<?= (int)$limit ?>">
    <?php if (!empty($tirages)): ?>
    <table class="digit-grid" id="toutGrid">
      <thead>
        <tr>
          <th><?= t('tout.col.tot') ?></th>
          <th>#</th>
          <?php foreach ($tirages as $t): ?>
            <th><?= htmlspecialchars((string)$t['Tirage'], ENT_QUOTES, 'UTF-8') ?></th>
          <?php endforeach; ?>
        </tr>
      </thead>
      <tbody>
        <?php for ($digit = 1; $digit <= 24; $digit++): ?>
          <?php $val = $totals[$digit]; ?>
          <tr>
            <td>&nbsp;<?= (int)$val ?>x&nbsp;</td>
            <td><?= $digit ?></td>
            <?php foreach ($tirages as $t):
              $isHit = isset($t['flip'][$digit]);
            ?>
              <td class="<?= $isHit ? 'hit' : '' ?>"><?= $isHit ? $digit : '' ?></td>
            <?php endforeach; ?>
          </tr>
        <?php endfor; ?>
      </tbody>
    </table>
    <?php else: ?>
    <p class="no-data"><?= t('tout.no_data') ?></p>
    <?php endif; ?>
  </div>

  <div class="tout-actions">
    <a href="#verifierModal" class="btn btn-tout-verify"><?= t('tout.btn.verify_combo') ?></a>
  </div>

  <span id="tout-root" class="tout-anchor"></span>

  <div id="verifierModal" class="tout-verifier-modal" role="dialog" aria-modal="true" aria-labelledby="verifierTitle" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="verifierTitle"><?= t('tout.modal.verify_title') ?></h3>
        <a href="#tout-root" class="modal-close" aria-label="<?= t('tout.modal.close') ?>">×</a>
      </div>
      <div class="modal-body">
        <iframe src="outis/verifier.php" title="<?= htmlspecialchars(t('tout.modal.verify_title'), ENT_QUOTES, 'UTF-8') ?>" loading="lazy" referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
  </div>
</div>
