<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Адаптивная страница с фоном</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
    <span>Здесь надпись на полосе</span>

    <div class="switch-wrapper">
      <label class="neon-switch" id="neonSwitch">
        <input type="checkbox" id="toggle" onchange="updateLabels()">
        <span class="neon-slider"></span>
      </label>
      <div class="switch-labels">
        <span id="labelOrder">Order</span>
        <span id="labelNimport">N'import</span>
      </div>
    </div>
  </header>

  <!-- Выпадающее меню -->
  <div id="dropdownMenu" class="dropdown-menu">
    <ul>
      <li><a href="#">Пункт 1</a></li>
      <li><a href="#">Пункт 2</a></li>
      <li><a href="#">Пункт 3</a></li>
    </ul>
  </div>

  <div class="container">
    <div class="tables-wrapper">
      <!-- Основная таблица -->
      <div class="table-container">
        <table class="interactive-table">
          <tbody>
            <!--TABLE_PLACEHOLDER-->
          </tbody>
        </table>
      </div>

      <!-- Таблица комбинаций -->
      <div class="combo-table-container">
        <table class="interactive-table">
          <thead>
            <tr>
              <th>n1</th>
              <th>n2</th>
              <th>Дней назад</th>
              <th>Дата</th>
            </tr>
          </thead>
          <tbody>
            <!--COMBO_PLACEHOLDER-->
          </tbody>
        </table>
      </div>

      <!-- Таблица дней с последнего появления чисел -->
      <div class="number-stats-table">
        <table class="interactive-table">
          <thead>
            <tr><th>Число</th><th>Дней с последнего</th></tr>
          </thead>
          <tbody>
            <!--NUMBER_STATS_PLACEHOLDER-->
          </tbody>
        </table>
      </div>
    </div>
  </div>


  <script>
    function toggleMenu() {
      const menu = document.getElementById("dropdownMenu");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    document.addEventListener('click', function (e) {
      const menu = document.getElementById("dropdownMenu");
      const icon = document.querySelector('.menu-icon');
      if (!menu.contains(e.target) && !icon.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    function updateLabels() {
      const toggle = document.getElementById("toggle");
      const isChecked = toggle.checked;

      document.getElementById("labelOrder").classList.toggle("active", !isChecked);
      document.getElementById("labelNimport").classList.toggle("active", isChecked);
      document.getElementById("neonSwitch").classList.toggle("active", isChecked);

      window.location.href = "?order=" + (isChecked ? 0 : 1);
    }

    // Установить состояние переключателя по URL
    window.onload = function () {
      const urlParams = new URLSearchParams(window.location.search);
      const order = urlParams.get('order') || '1';
      const toggle = document.getElementById("toggle");
      toggle.checked = (order === '0');
      updateLabels();
    }
  </script>

</body>
</html>
