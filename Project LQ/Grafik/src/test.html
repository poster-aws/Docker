<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Адаптивная страница с фоном</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
    <span>Quotidienne2</span>

    <div class="switch-wrapper">
      <label class="neon-switch" id="neonSwitch">
        <input type="checkbox" id="toggleSwitch">
        <span class="neon-slider"></span>
      </label>
      <div class="switch-labels">
        <span id="labelOrder">Order</span>
        <span id="labelNimport">N'import</span>
      </div>
    </div>
  </header>

  <!-- Выпадающее меню -->
  <div id="dropdownMenu" class="dropdown-menu">
    <ul>
      <li><a href="#">Quotidienne3</a></li>
      <li><a href="#">Quotidienne4</a></li>
      <li><a href="#">Tables</a></li>
    </ul>
  </div>

  <div class="container">
    <div class="tables-wrapper">
      <!-- Основная таблица -->
      <div class="table-container">
        <table class="interactive-table">
          <thead>
            <tr>
              <th>Tirage</th>
              <th>n1</th>
              <th>n2</th>
              <th>Jour<br>spassés</th>
              <th>L'avant<br>dernière</th>
              <th>Fois</th>
              <th>Max<br>jours passés</th>
            </tr>
          </thead>
          <tbody>
            <!--TABLE_PLACEHOLDER-->
          </tbody>
        </table>
      </div>

      <!-- Таблица комбинаций -->
      <div class="combo-table-container">
        <table class="interactive-table">
          <thead>
            <tr>
              <th>n1</th>
              <th>n2</th>
              <th>Jour<br>spassés</th>
              <th>Tirage</th>
            </tr>
          </thead>
          <tbody>
            <!--COMBO_PLACEHOLDER-->
          </tbody>
        </table>
      </div>

      <!-- Таблица дней с последнего появления чисел -->
      <div class="number-stats-table">
        <table class="interactive-table">
          <thead>
            <tr><th>#</th><th>Jours<br>passés</th></tr>
          </thead>
          <tbody>
            <!--NUMBER_STATS_PLACEHOLDER-->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Здесь PHP вставит нужный скрипт -->
  <!--SCRIPT_PLACEHOLDER-->

  <script>
    function toggleMenu() {
      const menu = document.getElementById("dropdownMenu");
      menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    document.addEventListener('click', function (e) {
      const menu = document.getElementById("dropdownMenu");
      const icon = document.querySelector('.menu-icon');
      if (!menu.contains(e.target) && !icon.contains(e.target)) {
        menu.style.display = "none";
      }
    });
  </script>

</body>
</html>
