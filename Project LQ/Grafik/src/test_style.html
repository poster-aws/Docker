<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест Переключателя</title>
  <style>
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .neon-switch {
      position: relative;
      width: 150px;
      height: 40px;
    }

    .neon-switch input {
      display: none;
    }

    .neon-slider {
      position: relative;
      background-color: #222;
      box-shadow: 0 0 5px #0ff;
      border-radius: 40px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0ff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.4s, color 0.4s;
    }

    .neon-slider:before {
      content: "";
      position: absolute;
      height: 30px;
      width: 30px;
      left: 5px;
      top: 5px;
      background-color: #0ff;
      box-shadow: 0 0 10px #0ff;
      border-radius: 50%;
      transition: transform 0.4s, background-color 0.4s, box-shadow 0.4s;
      z-index: 1;
    }

    .neon-slider .text-order {
      position: relative;
      z-index: 2;
      transition: color 0.4s;
    }

    .neon-slider .text-order::after {
      content: "Order";
    }

    .neon-switch input:checked + .neon-slider {
      color: #f0f;
      box-shadow: 0 0 5px #f0f;
    }

    .neon-switch input:checked + .neon-slider:before {
      transform: translateX(110px);
      background-color: #f0f;
      box-shadow: 0 0 10px #f0f;
    }

    .neon-switch input:checked + .neon-slider .text-order::after {
      content: "N'import";
    }
  </style>
</head>
<body>

  <label class="neon-switch">
    <input type="checkbox" id="toggleSwitch">
    <span class="neon-slider">
      <span class="text-order"></span>
    </span>
  </label>

</body>
</html>
