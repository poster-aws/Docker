services:

  app:
    build: .
    image: graber_astro
    container_name: graber_astro
    volumes:
      - .:/app
    environment:
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=user
      - DB_NAME=vie
    networks:
      - mysql_net

networks:
  mysql_net:
    external: true  # Используем уже созданную сеть