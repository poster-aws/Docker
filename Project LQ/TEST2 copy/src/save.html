  <script>
    document.querySelector('form').addEventListener('submit', function (e) {
      let hasError = false;
      const selects = this.querySelectorAll('select');

      selects.forEach(select => {
        if (!select.value) {
          select.classList.add('error');
          hasError = true;
        } else {
          select.classList.remove('error');
        }
      });

      if (hasError) {
        e.preventDefault();
      }
    });
  </script>
